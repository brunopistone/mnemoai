site_name: Mnemo AI
site_description: A local agentic AI assistant (LangGraph + MCP) that learns and remembers, with multi-provider model support.
site_url: https://brunopistone.github.io/mnemoai/
repo_url: https://github.com/brunopistone/mnemoai
repo_name: brunopistone/mnemoai
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/mnemoai-logo.png
  favicon: assets/mnemoai-logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Getting Started:
      - getting-started/index.md
      - Installation & first run: getting-started/installation.md
      - Core concepts:
          - Architecture: getting-started/architecture.md
          - The ~/.mnemoai directory: getting-started/mnemoai-directory.md
  - Guides:
      - guides/index.md
      - Everyday use:
          - Usage & commands: guides/usage.md
          - Everyday tools: guides/productivity-tools.md
          - Safety & permissions: guides/safety.md
          - Agent skills: guides/agent-skills.md
      - Extending & advanced:
          - Orchestration & sub-agents: guides/orchestration.md
          - Memory & learning: guides/memory.md
          - Knowledge & web tools: guides/knowledge-and-web.md
          - External MCP servers: guides/mcp.md
          - Tool hooks: guides/hooks.md
  - Reference:
      - Configuration: configuration.md
      - Tools reference: reference/tools.md
  - Development:
      - development/index.md
      - Ollama utilities: development/ollama-utilities.md
      - Troubleshooting: development/troubleshooting.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

plugins:
  - search

name: Tests

# Run the unit test tier on every push and PR. The integration tier
# (-m integration) needs a live Ollama server + a real config.yaml, so it is
# excluded here and run manually before releases (see the release checklist).
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  installer:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the checkout wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir "$RUNNER_TEMP/wheels"
      - name: Install, update and smoke-test the isolated runtime
        shell: bash
        run: |
          export MNEMOAI_INSTALL_DIR="$RUNNER_TEMP/mnemoai-runtime"
          export MNEMOAI_BIN_DIR="$RUNNER_TEMP/mnemoai-bin"
          export MNEMOAI_HOME="$RUNNER_TEMP/mnemoai-home"
          wheels=("$RUNNER_TEMP"/wheels/*.whl)
          test "${#wheels[@]}" -eq 1
          # Also exercise the pinned uv bootstrap, not a preinstalled runner uv.
          PATH=/usr/bin:/bin sh install.sh --wheel "${wheels[0]}"
          PATH=/usr/bin:/bin sh install.sh --wheel "${wheels[0]}"
          "$MNEMOAI_BIN_DIR/mnemoai" --help
          "$MNEMOAI_INSTALL_DIR/tools/mnemoai-assistant/bin/python" -c \
            'from mnemoai.client.client import LangGraphClient; from mnemoai.server.server import mcp'

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ripgrep
        # grep_search shells out to ripgrep; install it so its unit tests
        # actually run (they skip gracefully where rg is absent).
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install dependencies
        # requirements-dev.txt installs `-e .[dev,docs]`, which pulls the runtime
        # deps from pyproject too — one install, one source of truth.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Import sort check (ruff)
        # Gate on import sorting (the rule the project adopted via
        # extend-select=["I"]). Broader lint cleanup is tracked separately.
        run: ruff check --select I .
      - name: Unit tests + coverage floor
        # The floor guards against a large regression, it is not a target: it
        # sits just under the current measured number (64%). Raise it when
        # coverage genuinely improves; never lower it to make a PR pass.
        run: >-
          PYTHONPATH=src python -m pytest -m "not integration"
          --cov=src/mnemoai --cov-report=term-missing --cov-fail-under=60
